services:
  app1:
    build: .
    environment:
      - SERVER_PORT=8080
    networks: [internal]

  app2:
    build: .
    environment:
      - SERVER_PORT=8080
    networks: [internal]

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [internal]
    depends_on: [app1, app2]

networks:
  internal:
    internal: true