name: Run Tests on PR

on:
  pull_request:
    branches: [ master ]

jobs:
  test-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run tests
        run: mvn test

      - name: Build Docker image
        run: docker build -t app .

      - name: Run container
        run: |
          docker run -d -p 8080:8080 --name app app
          sleep 10

      - name: Curl test
        run: curl -f http://localhost:8080/api/hello